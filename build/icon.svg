<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 深色渐变底 + 上半 shine + 圆角：与 build/icon-pi-tui.svg 同一容器规格，
         也是 docs-site/public/icon.svg 的 120 视口版所对齐的规格（228/1024）。 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161719"/>
      <stop offset="0.58" stop-color="#050506"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.18" offset="0"/>
      <stop stop-color="#ffffff" stop-opacity="0" offset="0.52"/>
    </linearGradient>
    <!-- 银灰 π 字标：渐变与 renderer LogoMark 的 logo-mark-silver 同源。 -->
    <linearGradient id="glyph" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a7a8ab"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="512" rx="228" fill="url(#shine)"/>
  <!-- 字标 520 高、水平垂直居中（与 pi-tui 位图同一视心）：renderer 侧的
       viewBox="140 140 520 520" 裁剪域原样搬过来，保持与界面 LogoMark 同构图。 -->
  <g transform="translate(252, 252)">
    <svg viewBox="140 140 520 520" width="520" height="520">
      <path fill="url(#glyph)" fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/>
      <path fill="url(#glyph)" d="M517.36 400H634.72V634.72H517.36Z"/>
    </svg>
  </g>
</svg>
